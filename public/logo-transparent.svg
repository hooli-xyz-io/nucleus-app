<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g fill="none" stroke="#7e22ce" stroke-linecap="round" stroke-linejoin="round">
    <!-- Atomic Orbital Rings -->
    <ellipse cx="256" cy="225" rx="180" ry="60" stroke-width="13" transform="rotate(0 256 225)"/>
    <ellipse cx="256" cy="225" rx="180" ry="60" stroke-width="13" transform="rotate(60 256 225)"/>
    <ellipse cx="256" cy="225" rx="180" ry="60" stroke-width="13" transform="rotate(120 256 225)"/>

    <!-- Orbital Electron Nodes -->
    <circle cx="436" cy="225" r="10" fill="#9333ea" stroke="none"/>
    <circle cx="166" cy="69" r="10" fill="#9333ea" stroke="none"/>
    <circle cx="166" cy="381" r="10" fill="#9333ea" stroke="none"/>
  </g>

  <!-- Central Atomic Nucleus Core -->
  <g fill="#7e22ce">
    <circle cx="256" cy="225" r="30"/>
    <circle cx="238" cy="212" r="20" fill="#a855f7"/>
    <circle cx="274" cy="238" r="18" fill="#581c87"/>
  </g>

  <!-- Minimalist Typography -->
  <text x="256" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="8" fill="#a855f7">NUCLEUS</text>
  <text x="256" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="6" fill="#7e22ce">FRAMEWORK</text>
</svg>
